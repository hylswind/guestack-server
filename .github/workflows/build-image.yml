name: Build image

on:
  workflow_dispatch:

# The month this image serves. It is compiled into guestackd, so it is part of
# the measurements. Each month's build is a commit that changes this line.
env:
  EPOCH_ID: "2026-11"

permissions: {}

jobs:
  build:
    name: Build, measure, and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build guestackd
        run: make build EPOCH_ID="$EPOCH_ID"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Build image
        run: bash image/build.sh bin/guestackd out

      - name: Attest measurements
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/measurements.json

      - name: Record measurements
        run: |
          {
            echo '```json'
            cat out/measurements.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The only step that holds cloud credentials. Everything that builds has
      # already finished. The region and bucket are secrets so that the public
      # log masks them.
      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          prefix="s3://${S3_BUCKET}/${EPOCH_ID}/${GITHUB_RUN_ID}"
          aws s3 cp --only-show-errors --region "$AWS_REGION" out/image.raw "$prefix/image.raw"
          aws s3 cp --only-show-errors --region "$AWS_REGION" out/measurements.json "$prefix/measurements.json"
